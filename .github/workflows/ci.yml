name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: swift build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build all targets
        run: swift build

  test:
    name: swift test
    runs-on: macos-14
    needs: build
    steps:
      - uses: actions/checkout@v4
      # --skip-build is harmless here (swift test always builds what it
      # needs); the flag is in the spec to match the documented developer
      # workflow. The live-API test (testRealHaikuLiveCall) gates on
      # ANTHROPIC_API_KEY at runtime — without the secret it self-skips,
      # so we don't need a separate filter.
      - name: Run unit tests
        run: swift test --skip-build

  # Lint job removed in v0.1.6.2: swift-format isn't actually shipped
  # with the macos-14 GitHub Actions Swift toolchain (my earlier comment
  # claiming otherwise was wrong). The job failed on every push since
  # the workflow landed with "unable to invoke subcommand: swift-format
  # (No such file or directory)". Re-adding requires a `brew install
  # swift-format` step; defer until we want strict linting badly
  # enough to pay that build-time cost.
